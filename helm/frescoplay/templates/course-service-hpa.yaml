{{- if .Values.courseService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: course-service
  labels:
    app: course-service
    app.kubernetes.io/name: frescoplay
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: course-service
  minReplicas: {{ .Values.courseService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.courseService.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.courseService.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.courseService.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}