{{- if .Values.assessmentService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: assessment-service
  labels:
    app: assessment-service
    app.kubernetes.io/name: frescoplay
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: assessment-service
  minReplicas: {{ .Values.assessmentService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.assessmentService.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.assessmentService.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.assessmentService.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}