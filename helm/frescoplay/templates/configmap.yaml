apiVersion: v1
kind: ConfigMap
metadata:
  name: frescoplay-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  DB_HOST: {{ required "global.rdsEndpoint is required" .Values.global.rdsEndpoint | quote }}
  DB_PORT: {{ .Values.global.dbPort | quote }}
  USER_SERVICE_URL: {{ .Values.frontend.environment.userServiceUrl | quote }}
  COURSE_SERVICE_URL: {{ .Values.frontend.environment.courseServiceUrl | quote }}
  ASSESSMENT_SERVICE_URL: {{ .Values.frontend.environment.assessmentServiceUrl | quote }}
  LAB_SERVICE_URL: {{ .Values.frontend.environment.labServiceUrl | quote }}