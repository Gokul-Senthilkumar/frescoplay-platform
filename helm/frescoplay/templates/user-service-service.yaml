apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels:
    app: user-service
    app.kubernetes.io/name: frescoplay
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.userService.service.type }}
  selector:
    app: user-service
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.userService.service.port }}
      targetPort: {{ .Values.userService.containerPort }}