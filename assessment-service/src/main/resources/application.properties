spring.application.name=assessment-service
server.port=8083

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/fresco_assessments
spring.datasource.username=${ASSESSMENT_DB_USERNAME:fresco_assessment_user}
spring.datasource.password=${ASSESSMENT_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.jwt.secret=${JWT_SECRET}
