apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: frescoplay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 296283357585.dkr.ecr.us-east-1.amazonaws.com/frescoplay-frontend:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          env:
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: frescoplay-config
                  key: USER_SERVICE_URL
            - name: COURSE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: frescoplay-config
                  key: COURSE_SERVICE_URL
            - name: ASSESSMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: frescoplay-config
                  key: ASSESSMENT_SERVICE_URL
            - name: LAB_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: frescoplay-config
                  key: LAB_SERVICE_URL
