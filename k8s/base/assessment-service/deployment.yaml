apiVersion: apps/v1
kind: Deployment
metadata:
  name: assessment-service
  namespace: frescoplay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assessment-service
  template:
    metadata:
      labels:
        app: assessment-service
    spec:
      containers:
        - name: assessment-service
          image: 296283357585.dkr.ecr.us-east-1.amazonaws.com/frescoplay-assessment-service:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: frescoplay-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: frescoplay-config
                  key: DB_PORT
            - name: ASSESSMENT_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: frescoplay-secrets
                  key: ASSESSMENT_DB_USERNAME
            - name: ASSESSMENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frescoplay-secrets
                  key: ASSESSMENT_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: frescoplay-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 20
