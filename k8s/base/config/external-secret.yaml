apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frescoplay-external-secret
  namespace: frescoplay
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: frescoplay-secret-store
    kind: SecretStore
  target:
    name: frescoplay-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: frescoplay/database
        property: DB_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: frescoplay/database
        property: DB_PASSWORD
    - secretKey: COURSE_DB_USERNAME
      remoteRef:
        key: frescoplay/database
        property: COURSE_DB_USERNAME
    - secretKey: COURSE_DB_PASSWORD
      remoteRef:
        key: frescoplay/database
        property: COURSE_DB_PASSWORD
    - secretKey: ASSESSMENT_DB_USERNAME
      remoteRef:
        key: frescoplay/database
        property: ASSESSMENT_DB_USERNAME
    - secretKey: ASSESSMENT_DB_PASSWORD
      remoteRef:
        key: frescoplay/database
        property: ASSESSMENT_DB_PASSWORD
    - secretKey: LAB_DB_USERNAME
      remoteRef:
        key: frescoplay/database
        property: LAB_DB_USERNAME
    - secretKey: LAB_DB_PASSWORD
      remoteRef:
        key: frescoplay/database
        property: LAB_DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: frescoplay/database
        property: JWT_SECRET
