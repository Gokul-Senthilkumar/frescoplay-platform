name: FrescoPlay Microservices CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: frescoplay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build and Validate FrescoPlay
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and Test All Microservices
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes Manifests
        run: |
          set -euo pipefail
          kubectl kustomize k8s/overlays/lab > /tmp/frescoplay-manifests.yaml
          echo "Kubernetes manifests rendered successfully."
