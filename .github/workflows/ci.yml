name: FrescoPlay Microservices CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: frescoplay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build and Validate FrescoPlay
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and Test All Microservices
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.4

      - name: Validate Helm Chart
        run: |
          set -euo pipefail

          helm lint ./helm/frescoplay \
            -f ./helm/frescoplay/values-lab.yaml

          helm template frescoplay ./helm/frescoplay \
            --namespace frescoplay \
            -f ./helm/frescoplay/values-lab.yaml \
            --set-string global.awsAccountId=123456789012 \
            --set-string global.awsRegion=us-east-1 \
            --set-string global.imageTag=ci-validation \
            --set-string global.rdsEndpoint=example.rds.amazonaws.com \
            > /tmp/frescoplay-rendered.yaml

          echo "Helm chart validation successful."