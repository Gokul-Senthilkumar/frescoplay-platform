name: FrescoPlay Microservices CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: frescoplay-production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  K8S_NAMESPACE: frescoplay
  EKS_CLUSTER_NAME: eks-cicd
  DB_INSTANCE_IDENTIFIER: frescoplay-mysql-prod
  AWS_ROLE_ARN: arn:aws:iam::408203612554:role/GitHubActions-FrescoPlay-Role

jobs:
  build-push-deploy:
    name: Build, Push and Deploy FrescoPlay
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and Test All Microservices
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.4

      - name: Configure AWS Credentials Using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine AWS Account and RDS Endpoint
        run: |
          set -euo pipefail

          AWS_ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "Invalid AWS account ID: $AWS_ACCOUNT_ID"
            exit 1
          fi

          RDS_ENDPOINT="$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_INSTANCE_IDENTIFIER" \
            --region "$AWS_REGION" \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)"

          if [ -z "$RDS_ENDPOINT" ] || [ "$RDS_ENDPOINT" = "None" ]; then
            echo "Unable to determine RDS endpoint."
            exit 1
          fi

          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "AWS account ID: $AWS_ACCOUNT_ID"
          echo "RDS endpoint: $RDS_ENDPOINT"
          echo "ECR registry: $ECR_REGISTRY"

          echo "AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}" >> "$GITHUB_ENV"
          echo "RDS_ENDPOINT=${RDS_ENDPOINT}" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"

      - name: Validate FrescoPlay Helm Chart
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "===== Helm Chart Lint ====="

          helm lint ./helm/frescoplay \
            -f ./helm/frescoplay/values-lab.yaml \
            --set-string global.awsAccountId="$AWS_ACCOUNT_ID" \
            --set-string global.awsRegion="$AWS_REGION" \
            --set-string global.imageTag="$IMAGE_TAG" \
            --set-string global.rdsEndpoint="$RDS_ENDPOINT"

          echo "===== Helm Template Validation ====="

          helm template frescoplay ./helm/frescoplay \
            --namespace "$K8S_NAMESPACE" \
            -f ./helm/frescoplay/values-lab.yaml \
            --set-string global.awsAccountId="$AWS_ACCOUNT_ID" \
            --set-string global.awsRegion="$AWS_REGION" \
            --set-string global.imageTag="$IMAGE_TAG" \
            --set-string global.rdsEndpoint="$RDS_ENDPOINT" \
            > /tmp/frescoplay-helm-rendered.yaml

          echo "===== Rendered Kubernetes Resources ====="

          grep '^kind:' /tmp/frescoplay-helm-rendered.yaml \
            | sort \
            | uniq -c

          DEPLOYMENT_COUNT="$(grep -c '^kind: Deployment$' /tmp/frescoplay-helm-rendered.yaml)"
          HPA_COUNT="$(grep -c '^kind: HorizontalPodAutoscaler$' /tmp/frescoplay-helm-rendered.yaml || true)"

          if [ "$DEPLOYMENT_COUNT" -ne 5 ]; then
            echo "Expected 5 Deployments, found $DEPLOYMENT_COUNT"
            exit 1
          fi

          if [ "$HPA_COUNT" -ne 0 ]; then
            echo "Expected 0 HPAs for lab deployment, found $HPA_COUNT"
            exit 1
          fi

          echo "Lab Helm configuration validation passed."
          echo "Helm chart validation completed successfully."

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Microservice Images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          publish_image() {
            local repository="$1"
            local dockerfile="$2"
            local context="$3"
            local image="$ECR_REGISTRY/$repository:$IMAGE_TAG"

            echo "Checking ECR image: $image"

            if aws ecr describe-images \
              --region "$AWS_REGION" \
              --repository-name "$repository" \
              --image-ids "imageTag=$IMAGE_TAG" \
              >/dev/null 2>&1; then
              echo "Image already exists. Skipping: $image"
            else
              echo "Building image: $image"

              docker build \
                --file "$dockerfile" \
                --tag "$image" \
                "$context"

              echo "Pushing image: $image"
              docker push "$image"
            fi
          }

          publish_image frescoplay-frontend \
            frontend/Dockerfile frontend/

          publish_image frescoplay-user-service \
            user-service/Dockerfile user-service/

          publish_image frescoplay-course-service \
            course-service/Dockerfile course-service/

          publish_image frescoplay-assessment-service \
            assessment-service/Dockerfile assessment-service/

          publish_image frescoplay-lab-service \
            lab-service/Dockerfile lab-service/

      - name: Configure EKS Access
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"


      - name: Verify Helm Deployment Permissions
        run: |
          set -euo pipefail

          check_permission() {
            local verb="$1"
            local resource="$2"

            if ! kubectl auth can-i "$verb" "$resource" \
              --namespace "$K8S_NAMESPACE" | grep -qx "yes"; then
              echo "Missing permission: $verb $resource"
              exit 1
            fi
          }

          echo "Checking Helm release storage permissions..."

          for verb in get list create update delete; do
            check_permission "$verb" secrets
          done

          echo "Checking application resource permissions..."

          for resource in \
            deployments \
            services \
            configmaps \
            ingresses \
            horizontalpodautoscalers
          do
            for verb in get list create update patch delete; do
              check_permission "$verb" "$resource"
            done
          done

          echo "Checking rollout verification permissions..."

          for verb in get list watch; do
            check_permission "$verb" deployments
            check_permission "$verb" pods
          done

          echo "All required Helm deployment permissions verified."


      - name: Deploy FrescoPlay Using Helm
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          : "${AWS_ACCOUNT_ID:?AWS_ACCOUNT_ID is missing}"
          : "${RDS_ENDPOINT:?RDS_ENDPOINT is missing}"
          : "${IMAGE_TAG:?IMAGE_TAG is missing}"

          echo "Deploying FrescoPlay using Helm"
          echo "Image tag: $IMAGE_TAG"

          helm upgrade --install frescoplay ./helm/frescoplay \
            --namespace "$K8S_NAMESPACE" \
            -f ./helm/frescoplay/values-lab.yaml \
            --set-string global.awsAccountId="$AWS_ACCOUNT_ID" \
            --set-string global.awsRegion="$AWS_REGION" \
            --set-string global.imageTag="$IMAGE_TAG" \
            --set-string global.rdsEndpoint="$RDS_ENDPOINT" \
            --atomic \
            --wait \
            --timeout 10m \
            --history-max 10

          echo "===== Helm Release Status ====="

          helm status frescoplay \
            --namespace "$K8S_NAMESPACE"

          echo "===== Helm Release History ====="

          helm history frescoplay \
            --namespace "$K8S_NAMESPACE"


      - name: Verify Helm Deployment Rollouts
        run: |
          set -euo pipefail

          for deployment in \
            frontend \
            user-service \
            course-service \
            assessment-service \
            lab-service
          do
            echo "Checking rollout: $deployment"

            kubectl rollout status \
              "deployment/$deployment" \
              --namespace "$K8S_NAMESPACE" \
              --timeout=5m
          done

          echo "All five FrescoPlay deployments are ready."


      - name: Helm Deployment Summary
        if: always()
        run: |
          echo "===== Helm Release ====="
          helm list \
            --namespace "$K8S_NAMESPACE" || true

          echo "===== Helm Release Status ====="
          helm status frescoplay \
            --namespace "$K8S_NAMESPACE" || true

          echo "===== Deployments ====="
          kubectl get deployments \
            --namespace "$K8S_NAMESPACE" || true

          echo "===== Pods ====="
          kubectl get pods \
            --namespace "$K8S_NAMESPACE" -o wide || true

          echo "===== Services ====="
          kubectl get services \
            --namespace "$K8S_NAMESPACE" || true

          echo "===== HPA ====="
          kubectl get hpa \
            --namespace "$K8S_NAMESPACE" || true

          echo "===== Ingress ====="
          kubectl get ingress \
            --namespace "$K8S_NAMESPACE" || true

          echo "===== Recent Events ====="
          kubectl get events \
            --namespace "$K8S_NAMESPACE" \
            --sort-by=.metadata.creationTimestamp \
            | tail -n 40 || true
