name: FrescoPlay Microservices CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: frescoplay-production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  K8S_NAMESPACE: frescoplay
  EKS_CLUSTER_NAME: eks-cicd
  DB_INSTANCE_IDENTIFIER: frescoplay-mysql-prod
  AWS_ROLE_ARN: arn:aws:iam::340867432846:role/GitHubActions-FrescoPlay-Role

jobs:
  build-push-deploy:
    name: Build, Push and Deploy FrescoPlay
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and Test All Microservices
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure AWS Credentials Using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine AWS Account and RDS Endpoint
        run: |
          set -euo pipefail

          AWS_ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "Invalid AWS account ID: $AWS_ACCOUNT_ID"
            exit 1
          fi

          RDS_ENDPOINT="$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_INSTANCE_IDENTIFIER" \
            --region "$AWS_REGION" \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)"

          if [ -z "$RDS_ENDPOINT" ] || [ "$RDS_ENDPOINT" = "None" ]; then
            echo "Unable to determine RDS endpoint."
            exit 1
          fi

          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "AWS account ID: $AWS_ACCOUNT_ID"
          echo "RDS endpoint: $RDS_ENDPOINT"
          echo "ECR registry: $ECR_REGISTRY"

          echo "AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}" >> "$GITHUB_ENV"
          echo "RDS_ENDPOINT=${RDS_ENDPOINT}" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Microservice Images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          publish_image() {
            local repository="$1"
            local dockerfile="$2"
            local context="$3"
            local image="$ECR_REGISTRY/$repository:$IMAGE_TAG"

            echo "Checking ECR image: $image"

            if aws ecr describe-images \
              --region "$AWS_REGION" \
              --repository-name "$repository" \
              --image-ids "imageTag=$IMAGE_TAG" \
              >/dev/null 2>&1; then
              echo "Image already exists. Skipping: $image"
            else
              echo "Building image: $image"

              docker build \
                --file "$dockerfile" \
                --tag "$image" \
                "$context"

              echo "Pushing image: $image"
              docker push "$image"
            fi
          }

          publish_image frescoplay-frontend \
            frontend/Dockerfile frontend/

          publish_image frescoplay-user-service \
            user-service/Dockerfile user-service/

          publish_image frescoplay-course-service \
            course-service/Dockerfile course-service/

          publish_image frescoplay-assessment-service \
            assessment-service/Dockerfile assessment-service/

          publish_image frescoplay-lab-service \
            lab-service/Dockerfile lab-service/

      - name: Configure EKS Access
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Verify Namespace Deployment Permissions
        run: |
          set -euo pipefail

          kubectl auth can-i create deployments \
            --namespace "$K8S_NAMESPACE"

          kubectl auth can-i create services \
            --namespace "$K8S_NAMESPACE"

      - name: Render and Deploy FrescoPlay to EKS
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          : "${AWS_ACCOUNT_ID:?AWS_ACCOUNT_ID is missing}"
          : "${RDS_ENDPOINT:?RDS_ENDPOINT is missing}"
          : "${IMAGE_TAG:?IMAGE_TAG is missing}"

          echo "Deploying image tag: $IMAGE_TAG"

          kubectl kustomize k8s/overlays/lab \
            > /tmp/frescoplay-template.yaml

          sed \
            -e "s/\${AWS_ACCOUNT_ID}/${AWS_ACCOUNT_ID}/g" \
            -e "s/\${RDS_ENDPOINT}/${RDS_ENDPOINT}/g" \
            -e "s/\${IMAGE_TAG}/${IMAGE_TAG}/g" \
            /tmp/frescoplay-template.yaml \
            > /tmp/frescoplay-rendered.yaml

          if grep -nF '${' /tmp/frescoplay-rendered.yaml; then
            echo "Unresolved placeholders remain. Deployment stopped."
            exit 1
          fi

          if grep -nF ':IMAGE_TAG' /tmp/frescoplay-rendered.yaml; then
            echo "An old IMAGE_TAG placeholder remains. Deployment stopped."
            exit 1
          fi

          echo "Rendered image references and database endpoint:"
          grep -nE 'image:|DB_HOST:' /tmp/frescoplay-rendered.yaml

          kubectl apply -f /tmp/frescoplay-rendered.yaml

      - name: Verify Deployment Rollouts
        run: |
          set -euo pipefail

          for deployment in \
            frontend \
            user-service \
            course-service \
            assessment-service \
            lab-service
          do
            echo "Checking rollout: $deployment"

            kubectl rollout status \
              "deployment/$deployment" \
              --namespace "$K8S_NAMESPACE" \
              --timeout=5m
          done

      - name: Deployment Summary
        if: always()
        run: |
          echo "===== Deployments ====="
          kubectl get deployments \
            --namespace "$K8S_NAMESPACE" || true

          echo "===== Pods ====="
          kubectl get pods \
            --namespace "$K8S_NAMESPACE" -o wide || true

          echo "===== Services ====="
          kubectl get services \
            --namespace "$K8S_NAMESPACE" || true

          echo "===== Ingress ====="
          kubectl get ingress \
            --namespace "$K8S_NAMESPACE" || true

          echo "===== Recent Events ====="
          kubectl get events \
            --namespace "$K8S_NAMESPACE" \
            --sort-by=.metadata.creationTimestamp \
            | tail -n 40 || true