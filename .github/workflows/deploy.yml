name: FrescoPlay Microservices CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: frescoplay-production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "790267626946"
  ECR_REGISTRY: 790267626946.dkr.ecr.us-east-1.amazonaws.com
  K8S_NAMESPACE: frescoplay
  EKS_CLUSTER_NAME: eks-cicd
  AWS_ROLE_ARN: arn:aws:iam::790267626946:role/GitHubActions-FrescoPlay-Role

jobs:
  build-push-deploy:
    name: Build, Push and Deploy FrescoPlay
    runs-on: ubuntu-latest
    timeout-minutes: 40


    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and Test All Microservices
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Deployment Configuration
        run: |
          set -euo pipefail

          test -n "$AWS_ROLE_ARN"
          test -n "$EKS_CLUSTER_NAME"

          kubectl kustomize k8s/overlays/lab \
            > /tmp/frescoplay-manifests.yaml

          echo "Kubernetes manifests rendered successfully."

      - name: Configure AWS Credentials Using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Microservice Images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          publish_image() {
            local repository="$1"
            local dockerfile="$2"
            local context="$3"
            local image="$ECR_REGISTRY/$repository:$IMAGE_TAG"

            echo "Checking ECR image: $image"

            if aws ecr describe-images \
              --region "$AWS_REGION" \
              --repository-name "$repository" \
              --image-ids "imageTag=$IMAGE_TAG" \
              >/dev/null 2>&1; then

              echo "Image already exists. Skipping: $image"

            else
              echo "Building image: $image"

              docker build \
                --file "$dockerfile" \
                --tag "$image" \
                "$context"

              echo "Pushing image: $image"
              docker push "$image"
            fi
          }

          publish_image frescoplay-frontend \
            frontend/Dockerfile frontend/

          publish_image frescoplay-user-service \
            user-service/Dockerfile user-service/

          publish_image frescoplay-course-service \
            course-service/Dockerfile course-service/

          publish_image frescoplay-assessment-service \
            assessment-service/Dockerfile assessment-service/

          publish_image frescoplay-lab-service \
            lab-service/Dockerfile lab-service/

      - name: Configure EKS Access
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Verify Namespace Deployment Permissions
        run: |
          set -euo pipefail

          kubectl auth can-i create deployments \
            --namespace "$K8S_NAMESPACE"

          kubectl auth can-i create services \
            --namespace "$K8S_NAMESPACE"

      - name: Deploy FrescoPlay to EKS
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Deploying image tag: $IMAGE_TAG"

          kubectl kustomize k8s/overlays/lab \
            | sed "s/:IMAGE_TAG/:${IMAGE_TAG}/g" \
            | kubectl apply -f -

      - name: Verify Deployment Rollouts
        run: |
          set -euo pipefail

          for deployment in \
            frontend \
            user-service \
            course-service \
            assessment-service \
            lab-service
          do
            echo "Checking rollout: $deployment"

            kubectl rollout status \
              "deployment/$deployment" \
              --namespace "$K8S_NAMESPACE" \
              --timeout=5m
          done

      - name: Deployment Summary
        if: always()
        run: |
          echo "===== Deployments ====="
          kubectl get deployments \
            --namespace "$K8S_NAMESPACE" || true

          echo "===== Pods ====="
          kubectl get pods \
            --namespace "$K8S_NAMESPACE" -o wide || true

          echo "===== Services ====="
          kubectl get services \
            --namespace "$K8S_NAMESPACE" || true

          echo "===== Ingress ====="
          kubectl get ingress \
            --namespace "$K8S_NAMESPACE" || true
